name: CI

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: debian
    steps:
      - name: Install unzip and git
        run: apt-get update && apt-get install -y unzip git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      # The build checks the project and writes the types the lint of .kay files reads.
      - name: Build
        run: bun run build:dist

      - name: Lint
        run: bun run lint
