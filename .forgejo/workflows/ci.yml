name: CI

on:
  push:
    branches:
      - main

# Pinned so the cache step and bun agree on one folder, whatever HOME the runner image sets.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache

jobs:
  check:
    runs-on: alpine
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # A lockfile change still restores the closest older cache, so bun only fetches the packages that moved.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --silent --frozen-lockfile

      - name: Test
        run: bun run test

      # The build checks the project and writes the types the lint of .kay files reads.
      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint
